name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The plugin has no build step and no runtime dependencies: both suites are
      # plain Node scripts over the checked-in bundles.
      - name: Run tests
        run: npm test
